<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Funzioni 1</title>
</head>
<body>

    <script>
        function lanciaDado() {
            return Math.floor(Math.random() * (6 + 1 - 1) + 1);
        }

        function giocaADadi(tiri) {
            let punteggioGiocatore1 = 0;
            let punteggioGiocatore2 = 0;

            for (let i = 1; i <= tiri; i++) {
                punteggioGiocatore1 += lanciaDado();
                punteggioGiocatore2 += lanciaDado();
            }

            console.log(`Giocatore 1: ${punteggioGiocatore1} punti`);
            console.log(`Giocatore 2: ${punteggioGiocatore2} punti`);

            if (punteggioGiocatore1 > punteggioGiocatore2) {
                console.log("Vince il Giocatore 1");
            } else if (punteggioGiocatore2 > punteggioGiocatore1) {
                console.log("Vince il Giocatore 2");
            } else {
                console.log("Pareggio");
            }
        }

        let tiri;

        do {
            tiri = Number(prompt("Quanti tiri deve effettuare ogni giocatore?"));
        } while (!Number.isInteger(tiri) || tiri < 1);

        giocaADadi(tiri);
    </script>
</body>
</html>
